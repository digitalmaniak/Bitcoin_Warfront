<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Bitcoin Price War</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;
      font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;}
    #app,#app canvas{position:fixed;inset:0;display:block;}
    #hud{position:fixed;inset:0;pointer-events:none;color:#e8e8e8;user-select:none;}

    .price-wrap{position:absolute;top:22px;left:50%;transform:translateX(-50%);
      text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.85);}
    #price{font-size:44px;font-weight:700;letter-spacing:1px;}
    .sub{font-size:13px;letter-spacing:3px;color:#9a9aa5;margin-top:2px;}
    #chg.up{color:#2ecc71}
    #chg.down{color:#e74c3c}

    .feed{position:absolute;top:18px;left:18px;font-size:12px;letter-spacing:2px;
      color:#9a9aa5;display:flex;align-items:center;gap:8px;
      pointer-events:auto;cursor:pointer;user-select:none;}
    #feed-arrow{font-size:10px;color:#63636d;transition:transform .25s;}
    .feed.open #feed-arrow{transform:rotate(180deg);}
    .feed:hover #feed-name{color:#c9c9d2;}
    .feed-menu{position:absolute;top:26px;left:0;min-width:150px;z-index:6;
      background:rgba(15,15,20,.94);border:1px solid #333;border-radius:8px;
      overflow:hidden;max-height:0;opacity:0;border-width:0;
      transition:max-height .3s ease,opacity .25s ease;}
    .feed.open .feed-menu{max-height:340px;opacity:1;border-width:1px;}
    .fitem{padding:9px 14px;font-size:12px;letter-spacing:2px;color:#c9c9d2;}
    .fitem:hover{background:#1d1d26;color:#fff;}
    .fitem.sel{color:#2ecc71;}

    .opts{left:auto;right:18px;}
    .opts-menu{left:auto;right:0;min-width:190px;}
    .oitem{display:flex;justify-content:space-between;gap:14px;}
    .ostate{color:#63636d;font-weight:700;}
    .ostate.on{color:#2ecc71;}
    #opts-arrow{font-size:10px;color:#63636d;transition:transform .25s;}
    .opts.open #opts-arrow{transform:rotate(180deg);}

    body.clean .ladder,body.clean .tape,body.clean .hint,body.clean .chart-panel{display:none;}

    .chart-panel{position:absolute;bottom:22px;left:18px;width:380px;pointer-events:auto;
      background:rgba(15,15,20,.62);border:1px solid #26262e;border-radius:8px;padding:6px 8px;
      transition:transform .65s cubic-bezier(.4,0,.2,1),opacity .5s ease;}
    .chart-panel.offscreen{transform:translateY(160%);opacity:0;pointer-events:none;}
    .holo-row{display:flex;align-items:center;gap:10px;}
    .holo-row .tfs{margin-left:auto;}
    .chart-head{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:2px;
      color:#63636d;cursor:pointer;user-select:none;padding:2px 2px 6px;}
    .chart-head:hover{color:#9a9aa5;}
    .tfs{display:flex;gap:4px;margin-left:auto;}
    .tf{background:transparent;border:1px solid #333;border-radius:4px;color:#9a9aa5;
      font:10px 'JetBrains Mono',Menlo,monospace;letter-spacing:1px;padding:1px 6px;cursor:pointer;}
    .tf:hover{border-color:#555;}
    .tf.sel{color:#f7931a;border-color:#f7931a;}
    #chart-arrow{transition:transform .25s;transform:rotate(180deg);}
    .chart-panel.collapsed #chart-arrow{transform:rotate(0deg);}
    .chart-body{max-height:120px;overflow:hidden;opacity:1;
      transition:max-height .5s ease,opacity .4s ease;}
    .chart-panel.collapsed .chart-body{max-height:0;opacity:0;}
    @media (max-width:900px){.chart-panel{display:none;}}

    .report-overlay{position:fixed;inset:0;background:rgba(5,5,8,.78);display:none;
      align-items:center;justify-content:center;z-index:60;pointer-events:auto;}
    .report-overlay.show{display:flex;}
    .report-box{background:#0d0d12;border:1px solid #333;border-radius:10px;padding:14px;}
    .report-box canvas{width:min(760px,86vw);height:auto;display:block;border-radius:6px;}
    .report-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;}
    .report-btns .tf{font-size:12px;padding:5px 12px;}
    .dot{width:8px;height:8px;border-radius:50%;background:#666;flex:none;}
    .dot.live{background:#2ecc71;box-shadow:0 0 8px #2ecc71;}
    .dot.sim{background:#f39c12;box-shadow:0 0 8px #f39c12;}
    #round{position:absolute;top:42px;left:18px;font-size:12px;letter-spacing:2px;color:#66666f;}

    .kills{position:absolute;top:100px;font-size:12px;letter-spacing:2px;}
    #kills-bulls{left:18px;color:#2ecc71;}
    #kills-bears{right:18px;color:#e74c3c;text-align:right;}
    .kills .n{font-size:24px;font-weight:700;display:block;letter-spacing:1px;}
    .pot{width:110px;height:4px;background:#1c1c24;border-radius:2px;overflow:hidden;margin-top:7px;}
    .pot.pot-right{margin-left:auto;}
    #pot-b{height:100%;width:0%;background:#2ecc71;transition:width .25s;}
    #pot-r{height:100%;width:0%;background:#e74c3c;transition:width .25s;}

    .tug{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:380px;}
    .tug-bar{height:10px;border-radius:5px;overflow:hidden;background:#3a1518;border:1px solid #222;}
    #tug-buy{height:100%;background:#1f9d55;width:50%;transition:width .4s;}
    .tug-labels{display:flex;justify-content:space-between;font-size:11px;color:#9a9aa5;
      margin-top:5px;letter-spacing:1px;}

    #banner{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(.92);
      font-size:34px;font-weight:700;letter-spacing:5px;opacity:0;transition:all .35s;
      text-shadow:0 2px 18px rgba(0,0,0,.9);text-align:center;white-space:nowrap;}
    #banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
    #banner.bulls{color:#2ecc71}
    #banner.bears{color:#e74c3c}
    #banner.flat{color:#9a9aa5}
    #banner .bsub{display:block;font-size:13px;letter-spacing:3px;color:#9a9aa5;
      margin-top:8px;font-weight:400;}

    #whale{position:absolute;bottom:268px;left:50%;transform:translateX(-50%);font-size:15px;
      letter-spacing:2px;color:#f1c40f;opacity:0;transition:opacity .3s;
      text-shadow:0 0 14px rgba(241,196,15,.5);}
    #whale.show{opacity:1;}

    .hint{position:absolute;bottom:8px;right:12px;font-size:10px;color:#3c3c46;letter-spacing:1px;}

    #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;}
    .tape{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);width:380px;
      pointer-events:auto;display:flex;flex-direction:column;}
    .tape-head{font-size:10px;letter-spacing:2px;color:#63636d;display:flex;
      justify-content:space-between;cursor:pointer;padding:3px 4px;user-select:none;order:2;}
    .tape-head:hover{color:#9a9aa5;}
    #tape-arrow{transition:transform .25s;transform:rotate(180deg);} /* expanded: up */
    .tape.collapsed #tape-arrow{transform:rotate(0deg);}             /* collapsed: down */
    #tape-body{order:1;max-height:170px;overflow:hidden;opacity:1;
      display:flex;flex-direction:column;justify-content:flex-end;
      transition:max-height .6s ease,opacity .5s ease;
      -webkit-mask-image:linear-gradient(to bottom,transparent,black 35%);
      mask-image:linear-gradient(to bottom,transparent,black 35%);}
    .tape.collapsed #tape-body{max-height:0;opacity:0;}
    .trow{display:flex;justify-content:space-between;font-size:11px;line-height:1.45;
      padding:0 6px;letter-spacing:1px;}
    .trow.buy{color:#2ecc71;}
    .trow.sell{color:#e74c3c;}
    .trow.big{font-weight:700;background:rgba(255,255,255,.05);border-radius:3px;}
    .trow.liq{color:#c084fc;font-weight:700;background:rgba(192,132,252,.08);border-radius:3px;}

    .ladder{position:absolute;top:102px;left:50%;transform:translateX(-50%);width:252px;pointer-events:auto;}
    .ladder-head{font-size:11px;letter-spacing:2px;color:#9a9aa5;cursor:pointer;
      padding:4px 2px;display:flex;justify-content:space-between;user-select:none;}
    .ladder-head:hover{color:#c9c9d2;}
    #ladder-arrow{transition:transform .25s;transform:rotate(180deg);} /* expanded: up */
    .ladder.collapsed #ladder-arrow{transform:rotate(0deg);}           /* collapsed: down */
    #ladder-body{max-height:340px;overflow:hidden;opacity:1;
      transition:max-height .7s ease,opacity .55s ease;}
    .ladder.collapsed #ladder-body{max-height:0;opacity:0;}
    .lrow{display:flex;align-items:center;gap:9px;padding:6px 9px;margin-top:4px;
      background:rgba(20,20,28,.55);border:1px solid #26262e;border-left:3px solid var(--c);
      border-radius:6px;transition:box-shadow .25s,border-color .25s,background .25s;}
    .lrow svg{color:var(--c);flex:none;}
    .lrow .ln{color:#e8e8e8;font-weight:700;font-size:11px;letter-spacing:1px;flex:1;}
    .lrow .lt{color:var(--c);font-weight:700;font-size:11px;white-space:nowrap;}
    .lrow .lk{margin-left:9px;color:#8a8a94;border:1px solid #3a3a44;border-radius:4px;
      padding:0 5px;font-size:10px;line-height:1.5;flex:none;}
    .lrow.fire{box-shadow:0 0 14px var(--c);border-color:var(--c);background:#1d1d26;}
    @media (max-width:900px){.ladder{display:none;}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
