<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Bitcoin Price War</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;
      font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;}
    #app,#app canvas{position:fixed;inset:0;display:block;}
    #hud{position:fixed;inset:0;pointer-events:none;color:#e8e8e8;user-select:none;}

    .price-wrap{position:absolute;top:22px;left:50%;transform:translateX(-50%);
      text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.85);}
    #price{font-size:44px;font-weight:700;letter-spacing:1px;}
    .sub{font-size:13px;letter-spacing:3px;color:#9a9aa5;margin-top:2px;}
    #chg.up{color:#2ecc71}
    #chg.down{color:#e74c3c}

    .feed{position:absolute;top:18px;left:18px;font-size:12px;letter-spacing:2px;
      color:#9a9aa5;display:flex;align-items:center;gap:8px;}
    .dot{width:8px;height:8px;border-radius:50%;background:#666;flex:none;}
    .dot.live{background:#2ecc71;box-shadow:0 0 8px #2ecc71;}
    .dot.sim{background:#f39c12;box-shadow:0 0 8px #f39c12;}
    #round{position:absolute;top:42px;left:18px;font-size:12px;letter-spacing:2px;color:#66666f;}

    .kills{position:absolute;top:100px;font-size:12px;letter-spacing:2px;}
    #kills-bulls{left:18px;color:#2ecc71;}
    #kills-bears{right:18px;color:#e74c3c;text-align:right;}
    .kills .n{font-size:24px;font-weight:700;display:block;letter-spacing:1px;}
    .pot{width:110px;height:4px;background:#1c1c24;border-radius:2px;overflow:hidden;margin-top:7px;}
    .pot.pot-right{margin-left:auto;}
    #pot-b{height:100%;width:0%;background:#2ecc71;transition:width .25s;}
    #pot-r{height:100%;width:0%;background:#e74c3c;transition:width .25s;}

    .tug{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:380px;}
    .tug-bar{height:10px;border-radius:5px;overflow:hidden;background:#3a1518;border:1px solid #222;}
    #tug-buy{height:100%;background:#1f9d55;width:50%;transition:width .4s;}
    .tug-labels{display:flex;justify-content:space-between;font-size:11px;color:#9a9aa5;
      margin-top:5px;letter-spacing:1px;}

    #banner{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(.92);
      font-size:34px;font-weight:700;letter-spacing:5px;opacity:0;transition:all .35s;
      text-shadow:0 2px 18px rgba(0,0,0,.9);text-align:center;white-space:nowrap;}
    #banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
    #banner.bulls{color:#2ecc71}
    #banner.bears{color:#e74c3c}
    #banner.flat{color:#9a9aa5}
    #banner .bsub{display:block;font-size:13px;letter-spacing:3px;color:#9a9aa5;
      margin-top:8px;font-weight:400;}

    #whale{position:absolute;top:104px;left:50%;transform:translateX(-50%);font-size:15px;
      letter-spacing:2px;color:#f1c40f;opacity:0;transition:opacity .3s;
      text-shadow:0 0 14px rgba(241,196,15,.5);}
    #whale.show{opacity:1;}

    .hint{position:absolute;bottom:8px;right:12px;font-size:10px;color:#3c3c46;letter-spacing:1px;}
    #mute{position:absolute;bottom:22px;left:18px;pointer-events:auto;cursor:pointer;
      background:rgba(20,20,28,.6);border:1px solid #333;border-radius:6px;color:#ccc;
      font-size:16px;padding:5px 9px;}
    #mute:hover{border-color:#555;}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
